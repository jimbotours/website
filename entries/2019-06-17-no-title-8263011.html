<div id="lightbox" class="lightbox"><button aria-label="Close">&times;</button><img alt=""><div class="lb-controls"><button class="lb-prev" aria-label="Previous photo">&#8249;</button><button class="lb-next" aria-label="Next photo">&#8250;</button></div><div class="lb-caption"></div></div>

<footer>Jimbotours — rescued from GetJealous and rebuilt as a permanent archive.</footer>

<script>
document.addEventListener("DOMContentLoaded",function(){
  var box=document.getElementById("lightbox");
  if(box){
    var pic=box.querySelector("img"), cap=box.querySelector(".lb-caption");
    var links=Array.from(document.querySelectorAll("a.lb")), idx=0;
    function show(n){
      if(!links.length)return;
      idx=(n+links.length)%links.length;
      pic.src=links[idx].href;
      var im=links[idx].querySelector("img");
      cap.textContent=im ? (im.alt||"") : "";
      box.classList.add("open");
    }
    links.forEach(function(a,i){a.addEventListener("click",function(e){e.preventDefault();show(i);});});
    var prev=box.querySelector(".lb-prev"), next=box.querySelector(".lb-next");
    if(prev) prev.addEventListener("click",function(e){e.stopPropagation();show(idx-1);});
    if(next) next.addEventListener("click",function(e){e.stopPropagation();show(idx+1);});
    box.addEventListener("click",function(e){
      if(e.target===box || (e.target.tagName==="BUTTON" && !e.target.classList.contains("lb-prev") && !e.target.classList.contains("lb-next"))){
        box.classList.remove("open");pic.src="";
      }
    });
    document.addEventListener("keydown",function(e){
      if(!box.classList.contains("open"))return;
      if(e.key==="Escape"){box.classList.remove("open");pic.src="";}
      if(e.key==="ArrowLeft")show(idx-1);
      if(e.key==="ArrowRight")show(idx+1);
    });
  }
  document.querySelectorAll(".trip-card img").forEach(function(img){
    img.addEventListener("error",function(){
      var card=img.closest(".trip-card");
      img.remove();
      if(card) card.classList.add("no-photo");
    });
  });
});
</script>
